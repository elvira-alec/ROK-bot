<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake RoK UI (test page)</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Test stand-in for the real game UI, built from pieces of real screenshots
// (tests/fake_game/real/*.png) at half the size of the phone screenshots.
// Implements what the patrol needs: coordinate readout + search box, troop
// panel with gathering badges, RECALL box, dotted march lines, zoom, drag.
(() => {
  const W = 1434, H = 660;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = n => { const i = new Image(); i.src = 'real/' + n + '.png'; return i; };
  const A = { grass: img('grass'), panel: img('panel'), recall: img('recall_button'),
              city: img('enemy_city_icon'), res: img('resource_icon') };

  // map tile -> screen pixel mapping (deliberately not a plain grid)
  const M = [[24, 10], [-8, 20]];
  const det = M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const Minv = [[M[1][1] / det, -M[0][1] / det], [-M[1][0] / det, M[0][0] / det]];
  const state = {
    cam: { x: 209, y: 418 }, simple: false, dialog: null, box: null,
    troops: [ { at: [205, 424], recalled: false }, { at: [200, 410], recalled: false },
              { at: [215, 430], recalled: false } ],
    marches: [], clicks: [], typed: '',
    sites: { enemy: [162, 374], city: [209, 418], camp: [205, 424], stone: [200, 410], farm: [215, 430] },
  };
  const toScreen = (tx, ty) => {
    const dx = tx - state.cam.x, dy = ty - state.cam.y;
    return [W / 2 + M[0][0] * dx + M[0][1] * dy, H / 2 + M[1][0] * dx + M[1][1] * dy];
  };

  // ---------- layout of clickable things (half of real screenshot positions)
  const coordBar = () => state.simple ? { x: 75, y: 0, w: 160, h: 28 } : { x: 285, y: 0, w: 160, h: 28 };
  const portrait = i => ({ x: 1339 - 26, y: 168 + 60 * i - 26, w: 52, h: 52 });
  const badge = i => [1357, 191 + 60 * i];
  const dlg = { x: 517, y: 200, w: 400, h: 230 };
  const fields = { x: { x: 610, y: 280, w: 110, h: 36 }, y: { x: 790, y: 280, w: 110, h: 36 } };
  const goBtn = { x: 657, y: 360, w: 120, h: 44 };
  const box = { x: 785, y: 162, w: 440, h: 330 };
  const recallBtn = { x: 915, y: 412, w: 180, h: 62 };
  const inside = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  function text(s, x, y, size = 19, color = '#fff', stroke = true) {
    ctx.font = `bold ${size}px Arial`;
    if (stroke) { ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(s, x, y); }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  function dotted(p, q, color, t) {
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]), step = 11.5, ux = (q[0] - p[0]) / len, uy = (q[1] - p[1]) / len;
    const off = (t * 20) % step;
    for (let d = off; d < len; d += step) {
      const x = p[0] + ux * d, y = p[1] + uy * d;
      ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7);
      if (color === 'green') { ctx.fillStyle = '#16b016'; ctx.fill(); ctx.lineWidth = 0.7; ctx.strokeStyle = '#063'; ctx.stroke(); }
      else { ctx.fillStyle = color === 'red' ? '#e81414' : '#f6f6f6'; ctx.fill(); }
    }
  }

  function draw(now) {
    const t = now / 1000;
    // map: real grass texture, shifted with the camera
    const [ox, oy] = toScreen(0, 0);
    if (A.grass.complete && A.grass.naturalWidth) {
      const gw = A.grass.width, gh = A.grass.height;
      const sx = ((ox % gw) + gw) % gw - gw, sy = ((oy % gh) + gh) % gh - gh;
      for (let x = sx; x < W; x += gw) for (let y = sy; y < H; y += gh) ctx.drawImage(A.grass, x, y);
    } else { ctx.fillStyle = '#7fae4a'; ctx.fillRect(0, 0, W, H); }
    // places
    for (const [name, [tx, ty]] of Object.entries(state.sites)) {
      const [x, y] = toScreen(tx, ty);
      if (x < -100 || y < -100 || x > W + 100 || y > H + 100) continue;
      const im = name === 'enemy' || name === 'city' ? A.city : A.res;
      if (im.complete) ctx.drawImage(im, x - im.width / 2, y - im.height / 2);
    }
    // marches: dotted line over the whole route, army icon part way along
    for (const m of state.marches) {
      const p = toScreen(...m.from), q = toScreen(...m.to);
      dotted(p, q, m.color, t);
      const k = Math.min(0.95, m.progress + (t - m.t0) * 0.002);
      const ax = p[0] + (q[0] - p[0]) * k, ay = p[1] + (q[1] - p[1]) * k;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#556'; ctx.fillRect(-11, -11, 22, 22); ctx.strokeStyle = '#222'; ctx.strokeRect(-11, -11, 22, 22);
      ctx.restore();
    }
    // HUD
    const cb = coordBar();
    if (!state.simple) {
      ctx.fillStyle = '#1b4f9a'; ctx.fillRect(32, 0, 52, 62);
      text("1,771,045", 100, 22, 18); text('VIP 7', 105, 50, 15, '#f3c84b');
    }
    text(`#4183 X:${state.cam.x} Y:${state.cam.y}`, cb.x + 6, 21, 17);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(cb.x + cb.w + 10, 12, 6, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cb.x + cb.w + 14, 16); ctx.lineTo(cb.x + cb.w + 19, 21); ctx.stroke();
    // troop panel (real screenshot piece); recalled troops get a grey "returning" badge
    if (A.panel.complete) ctx.drawImage(A.panel, 1280, 115);
    state.troops.forEach((tr, i) => {
      if (!tr.recalled) return;
      const [bx, by] = badge(i);
      ctx.fillStyle = '#8a8a8a'; ctx.beginPath(); ctx.arc(bx, by, 10, 0, 7); ctx.fill();
    });
    // troop info box with RECALL
    if (state.box !== null) {
      const tr = state.troops[state.box];
      ctx.fillStyle = '#f2efe6'; ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.strokeStyle = '#999'; ctx.strokeRect(box.x, box.y, box.w, box.h);
      text('Resource Point', box.x + 20, box.y + 30, 15, '#2a7a2a', false);
      text(`X:${tr.at[0]} Y:${tr.at[1]}`, box.x + 230, box.y + 30, 15, '#777', false);
      text('Level 3 Logging Camp', box.x + 150, box.y + 90, 20, '#8a4b2a', false);
      text('Gatherer  [JONS]IronAR', box.x + 150, box.y + 140, 16, '#333', false);
      if (!tr.recalled && A.recall.complete) ctx.drawImage(A.recall, recallBtn.x, recallBtn.y);
      if (tr.recalled) text('Returning', box.x + 170, box.y + 290, 20, '#555', false);
    }
    // coordinate search box
    if (state.dialog) {
      ctx.fillStyle = '#efe6d2'; ctx.fillRect(dlg.x, dlg.y, dlg.w, dlg.h);
      ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 3; ctx.strokeRect(dlg.x, dlg.y, dlg.w, dlg.h);
      text('Coordinates', dlg.x + 135, dlg.y + 36, 20, '#5a3d1b', false);
      for (const k of ['x', 'y']) {
        const f = fields[k];
        text(k.toUpperCase(), f.x - 30, f.y + 26, 22, '#5a3d1b', false);
        ctx.fillStyle = state.dialog.focus === k ? '#fff' : '#f8f8f8'; ctx.fillRect(f.x, f.y, f.w, f.h);
        ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(f.x, f.y, f.w, f.h);
        text(state.dialog[k], f.x + 10, f.y + 26, 20, '#222', false);
      }
      ctx.fillStyle = '#2a8de0'; ctx.fillRect(goBtn.x, goBtn.y, goBtn.w, goBtn.h);
      text('Go', goBtn.x + 45, goBtn.y + 30, 22, '#fff', false);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------- input
  let down = null;
  cv.addEventListener('mousedown', e => { down = { x: e.offsetX, y: e.offsetY, cam: { ...state.cam } }; });
  cv.addEventListener('mousemove', e => {
    if (!down || state.dialog) return;
    const dx = e.offsetX - down.x, dy = e.offsetY - down.y;
    if (Math.hypot(dx, dy) < 6) return;
    // drag: the map follows the mouse, so the camera moves the other way
    state.cam.x = Math.round(down.cam.x - (Minv[0][0] * dx + Minv[0][1] * dy));
    state.cam.y = Math.round(down.cam.y - (Minv[1][0] * dx + Minv[1][1] * dy));
    down.dragged = true;
  });
  cv.addEventListener('mouseup', e => {
    const d = down; down = null;
    if (d && d.dragged) return;
    click(e.offsetX, e.offsetY);
  });
  function click(x, y) {
    state.clicks.push([x, y]);
    if (state.dialog) {
      for (const k of ['x', 'y']) if (inside(fields[k], x, y)) { state.dialog.focus = k; return; }
      if (inside(goBtn, x, y)) return go();
      if (!inside(dlg, x, y)) state.dialog = null;
      return;
    }
    const cb = coordBar();
    if (inside({ x: cb.x, y: cb.y, w: cb.w + 30, h: cb.h }, x, y)) {
      state.dialog = { x: String(state.cam.x), y: String(state.cam.y), focus: null, all: false };
      return;
    }
    if (state.box !== null) {
      const tr = state.troops[state.box];
      if (!tr.recalled && inside(recallBtn, x, y)) { tr.recalled = true; state.box = null; return; }
      if (!inside(box, x, y)) state.box = null;
    }
    for (let i = 0; i < state.troops.length; i++) {
      if (inside(portrait(i), x, y)) { state.box = i; state.cam.x = state.troops[i].at[0]; state.cam.y = state.troops[i].at[1]; return; }
    }
  }
  function go() {
    const X = parseInt(state.dialog.x, 10), Y = parseInt(state.dialog.y, 10);
    if (!isNaN(X) && !isNaN(Y)) { state.cam.x = X; state.cam.y = Y; }
    state.dialog = null;
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { state.dialog = null; state.box = null; return; }
    const D = state.dialog;
    if (!D) return;
    if (e.key === 'Enter') return go();
    if (!D.focus) return;
    if (e.ctrlKey && e.key.toLowerCase() === 'a') { D.all = true; return; }
    if (e.key === 'Backspace') { D[D.focus] = D.all ? '' : D[D.focus].slice(0, -1); D.all = false; return; }
    if (/^\d$/.test(e.key)) { if (D.all) { D[D.focus] = ''; D.all = false; } D[D.focus] += e.key; state.typed += e.key; }
  });
  cv.addEventListener('wheel', e => { state.simple = e.deltaY > 0; e.preventDefault(); }, { passive: false });

  window.sim = {
    state,
    march: (from, to, color = 'white', progress = 0.3) => {
      const P = v => (typeof v === 'string' ? state.sites[v] : v);
      state.marches.push({ from: P(from), to: P(to), color, progress, t0: performance.now() / 1000 });
    },
    clear: () => { state.marches.length = 0; },
    ready: () => Object.values(A).every(i => i.complete && i.naturalWidth > 0),
  };
  // for the command-line test:  rok.html#march=enemy,camp,white
  const mh = new URLSearchParams(location.hash.slice(1)).get('march');
  if (mh) { const [f, t, c] = mh.split(','); sim.march(f, t, c || 'white', 0.2); }
})();
</script>
</body>
</html>
