<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fake RoK UI (test page)</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Test stand-in for the real game UI, built from pieces of real screenshots
// (tests/fake_game/real/*.png) at half the size of the phone screenshots.
// Implements what the patrol needs: coordinate readout + search box, troop
// panel with gathering badges, RECALL box, dotted march lines, zoom, drag.
(() => {
  const W = 1434, H = 660;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = n => { const i = new Image(); i.src = 'real/' + n + '.png'; return i; };
  const A = { grass: img('grass'), panel: img('panel'), recall: img('recall_button'),
              city: img('city_tower'), res: img('resource_icon'), army: img('army_icon'), scout: img('scout_icon'), globe: img('globe') };
  const owner = { enemy: '[P83L]JONH WICK', city: '[JONS]IronAR' };

  // map tile -> screen pixel mapping (deliberately not a plain grid)
  const M = [[24, 10], [-8, 20]];
  const det = M[0][0] * M[1][1] - M[0][1] * M[1][0];
  const Minv = [[M[1][1] / det, -M[0][1] / det], [-M[1][0] / det, M[0][0] / det]];
  const state = {
    cam: { x: 209, y: 418 }, zoom: 0, simple: false, dialog: null, box: null,  // zoom: 0 close, 1 patrol, 2 far
    troops: [ { at: [205, 424], recalled: false }, { at: [200, 410], recalled: false },
              { at: [215, 430], recalled: false } ],
    marches: [], farmers: [], clicks: [], typed: '',
    sites: { enemy: [162, 374], city: [209, 418], camp: [205, 424], stone: [200, 410], farm: [215, 430] },
  };
  const toScreen = (tx, ty) => {
    const dx = tx - state.cam.x, dy = ty - state.cam.y;
    return [W / 2 + M[0][0] * dx + M[0][1] * dy, H / 2 + M[1][0] * dx + M[1][1] * dy];
  };

  // ---------- layout of clickable things (half of real screenshot positions)
  const magnifier = () => { const cb = coordBar(); return { x: cb.x + cb.w + 12, y: 18 }; };
  const star = () => { const cb = coordBar(); return { x: cb.x + cb.w + 36, y: 6, w: 24, h: 24 }; };
  const coordBar = () => state.simple ? { x: 75, y: 0, w: 160, h: 28 } : { x: 285, y: 0, w: 160, h: 28 };
  const portrait = i => ({ x: 1339 - 26, y: 168 + 60 * i - 26, w: 52, h: 52 });
  const badge = i => [1357, 191 + 60 * i];
  // the real search bar: '#: 4183  X: [   ]  Y: [   ]  (blue search button)', boxes empty
  const dlg = { x: 462, y: 106, w: 510, h: 50 };
  const fields = { x: { x: 667, y: 112, w: 96, h: 38 }, y: { x: 806, y: 112, w: 100, h: 38 } };
  const goBtn = { x: 921, y: 110, w: 42, h: 38 };
  const box = { x: 785, y: 162, w: 440, h: 330 };
  const recallBtn = { x: 915, y: 412, w: 180, h: 62 };
  const inside = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  function text(s, x, y, size = 19, color = '#fff', stroke = true) {
    ctx.font = `bold ${size}px Arial`;
    if (stroke) { ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(s, x, y); }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  function troops(x, y, name) {
    for (let i = 0; i < 9; i++) {
      const dx = (i % 3) * 7 - 7, dy = Math.floor(i / 3) * 6 - 6;
      ctx.fillStyle = '#7a2a20'; ctx.fillRect(x + dx - 2, y + dy - 4, 5, 8);
      ctx.fillStyle = '#d33'; ctx.fillRect(x + dx - 2, y + dy - 6, 5, 3);
    }
    if (name) text(name, x - ctx.measureText(name).width / 2 - 20, y - 18, 13, '#f0f0f0');
  }

  function dotted(p, q, color, t) {
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]), step = 11.5, ux = (q[0] - p[0]) / len, uy = (q[1] - p[1]) / len;
    const off = (t * 20) % step;
    for (let d = off; d < len; d += step) {
      const x = p[0] + ux * d, y = p[1] + uy * d;
      ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7);
      if (color === 'green') { ctx.fillStyle = '#16b016'; ctx.fill(); ctx.lineWidth = 0.7; ctx.strokeStyle = '#063'; ctx.stroke(); }
      else { ctx.fillStyle = color === 'red' ? '#e81414' : '#f6f6f6'; ctx.fill(); }
    }
  }

  function draw(now) {
    const t = now / 1000;
    // map: real grass texture, shifted with the camera
    const [ox, oy] = toScreen(0, 0);
    if (A.grass.complete && A.grass.naturalWidth) {
      const gw = A.grass.width, gh = A.grass.height;
      const sx = ((ox % gw) + gw) % gw - gw, sy = ((oy % gh) + gh) % gh - gh;
      for (let x = sx; x < W; x += gw) for (let y = sy; y < H; y += gh) ctx.drawImage(A.grass, x, y);
    } else { ctx.fillStyle = '#7fae4a'; ctx.fillRect(0, 0, W, H); }
    // places
    for (const [name, [tx, ty]] of Object.entries(state.sites)) {
      const [x, y] = toScreen(tx, ty);
      if (x < -100 || y < -100 || x > W + 100 || y > H + 100) continue;
      if (state.zoom === 2 && !owner[name]) continue;  // too far out: no resource points
      const im = owner[name] ? A.city : A.res;
      if (im.complete) ctx.drawImage(im, x - im.width / 2, y - im.height / 2);
      if (owner[name]) {
        // city name on a dark plate, with the city level in a small light tag underneath
        ctx.font = 'bold 13px Arial'; const tw = ctx.measureText(owner[name]).width;
        ctx.fillStyle = 'rgba(30,30,30,0.8)'; ctx.fillRect(x - tw / 2 - 8, y + 22, tw + 16, 18);
        ctx.fillStyle = name === 'city' ? '#7dff7d' : '#ddd'; ctx.fillText(owner[name], x - tw / 2, y + 36);
        const lvl = name === 'city' ? '16' : '21';
        ctx.fillStyle = '#e8e8e8'; ctx.fillRect(x - 11, y + 42, 22, 12);
        ctx.fillStyle = '#111'; ctx.font = 'bold 10px Arial'; ctx.fillText(lvl, x - 6, y + 52);
      }
    }
    // marches: dotted line over the whole route, army icon part way along
    for (const m of state.marches) {
      const p = toScreen(...m.from), q = toScreen(...m.to);
      dotted(p, q, m.color, t);
      // Other players' armies show as the grey diamond. (Your own army icon isn't
      // known yet, so green marches get none.)
      const k = Math.max(0.02, Math.min(0.98, m.progress + (t - m.t0) * m.speed));
      const ax = p[0] + (q[0] - p[0]) * k, ay = p[1] + (q[1] - p[1]) * k;
      const icon = m.kind === 'scout' ? A.scout : A.army;   // plain pyramid = scout
      if (m.owner && state.zoom === 0) troops(ax, ay, m.owner);
      else if (m.color !== 'green' && state.zoom < 2 && icon.complete) ctx.drawImage(icon, ax - icon.width / 2, ay - icon.height / 2);
    }
    // armies standing still (e.g. gathering on a resource point)
    for (const f of state.farmers) {
      const [x, y] = toScreen(...f.at);
      if (state.zoom === 0) troops(x, y, f.owner);
      else if (state.zoom === 1 && A.army.complete) ctx.drawImage(A.army, x - A.army.width / 2, y - A.army.height / 2);
    }
    // HUD
    const cb = coordBar();
    if (!state.simple) {
      ctx.fillStyle = '#1b4f9a'; ctx.fillRect(32, 0, 52, 62);
      text("1,771,045", 100, 22, 18); text('VIP 7', 105, 50, 15, '#f3c84b');
    }
    text(`#4183 X:${state.cam.x} Y:${state.cam.y}`, cb.x + 6, 21, 17);
    // magnifier (opens the search) and, right after it, the orange favourites star (a trap)
    const mg = magnifier(), st = star();
    ctx.lineWidth = 2.2; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(mg.x - 1, mg.y - 1, 5, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mg.x + 3, mg.y + 3); ctx.lineTo(mg.x + 7, mg.y + 7); ctx.stroke();
    ctx.fillStyle = '#f39a12'; ctx.fillRect(st.x, st.y, st.w, st.h);
    ctx.fillStyle = '#b65f0a'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('★', st.x + 4, st.y + 18);
    if (state.favs) {
      ctx.fillStyle = 'rgba(240,235,220,0.97)'; ctx.fillRect(400, 120, 640, 400);
      text('Favorites', 650, 160, 22, '#5a3a1a', false);
    }
    // troop panel (real screenshot piece); recalled troops get a grey "returning" badge
    if (A.panel.complete) ctx.drawImage(A.panel, 1280, 115);
    state.troops.forEach((tr, i) => {
      if (!tr.recalled) return;
      const [bx, by] = badge(i);
      ctx.fillStyle = '#8a8a8a'; ctx.beginPath(); ctx.arc(bx, by, 10, 0, 7); ctx.fill();
    });
    // troop info box with RECALL
    if (state.box !== null) {
      const tr = state.troops[state.box];
      ctx.fillStyle = '#f2efe6'; ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.strokeStyle = '#999'; ctx.strokeRect(box.x, box.y, box.w, box.h);
      text('Resource Point', box.x + 20, box.y + 30, 15, '#2a7a2a', false);
      text(`X:${tr.at[0]} Y:${tr.at[1]}`, box.x + 230, box.y + 30, 15, '#777', false);
      text('Level 3 Logging Camp', box.x + 150, box.y + 90, 20, '#8a4b2a', false);
      text('Gatherer  [JONS]IronAR', box.x + 150, box.y + 140, 16, '#333', false);
      if (!tr.recalled && A.recall.complete) ctx.drawImage(A.recall, recallBtn.x, recallBtn.y);
      if (tr.recalled) text('Returning', box.x + 170, box.y + 290, 20, '#555', false);
    }
    // coordinate search bar
    if (state.dialog) {
      ctx.fillStyle = 'rgba(25,30,40,0.82)'; ctx.fillRect(dlg.x, dlg.y, dlg.w, dlg.h);
      text('#:', dlg.x + 8, dlg.y + 33, 19, '#eee', false); text('4183', dlg.x + 38, dlg.y + 33, 19, '#eee', false);
      text('X:', fields.x.x - 36, dlg.y + 35, 19, '#eee', false); text('Y:', fields.y.x - 30, dlg.y + 35, 19, '#eee', false);
      for (const k of ['x', 'y']) {
        const f = fields[k];
        ctx.fillStyle = 'rgba(10,14,20,0.55)'; ctx.fillRect(f.x, f.y, f.w, f.h);
        text(state.dialog[k], f.x + 8, f.y + 27, 19, '#fff', false);
      }
      ctx.fillStyle = '#0fb4f0'; ctx.fillRect(goBtn.x, goBtn.y, goBtn.w, goBtn.h);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(goBtn.x + 19, goBtn.y + 17, 8, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(goBtn.x + 25, goBtn.y + 23); ctx.lineTo(goBtn.x + 32, goBtn.y + 31); ctx.stroke();
    }
    // zoomed out too far: the globe button appears bottom right
    if (state.zoom === 2 && A.globe.complete) ctx.drawImage(A.globe, W - 85, H - 70);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ---------- input
  let down = null;
  cv.addEventListener('mousedown', e => { down = { x: e.offsetX, y: e.offsetY, cam: { ...state.cam } }; });
  cv.addEventListener('mousemove', e => {
    if (!down || state.dialog) return;
    const dx = e.offsetX - down.x, dy = e.offsetY - down.y;
    if (Math.hypot(dx, dy) < 6) return;
    // drag: the map follows the mouse, so the camera moves the other way
    state.cam.x = Math.round(down.cam.x - (Minv[0][0] * dx + Minv[0][1] * dy));
    state.cam.y = Math.round(down.cam.y - (Minv[1][0] * dx + Minv[1][1] * dy));
    down.dragged = true;
  });
  cv.addEventListener('mouseup', e => {
    const d = down; down = null;
    if (d && d.dragged) return;
    click(e.offsetX, e.offsetY);
  });
  function click(x, y) {
    state.clicks.push([x, y]);
    if (state.dialog) {
      for (const k of ['x', 'y']) if (inside(fields[k], x, y)) { state.dialog.focus = k; return; }
      if (inside(goBtn, x, y)) return go();
      if (!inside(dlg, x, y)) state.dialog = null;
      return;
    }
    if (state.favs) { state.favs = false; return; }
    if (inside(star(), x, y)) { state.favs = true; state.starClicks = (state.starClicks || 0) + 1; return; }
    const cb = coordBar(), mg = magnifier();
    if (inside({ x: cb.x, y: cb.y, w: cb.w, h: cb.h }, x, y) ||
        inside({ x: mg.x - 11, y: mg.y - 11, w: 22, h: 22 }, x, y)) {
      state.dialog = { x: '', y: '', focus: null, all: false };
      return;
    }
    if (state.box !== null) {
      const tr = state.troops[state.box];
      if (!tr.recalled && inside(recallBtn, x, y)) { tr.recalled = true; state.box = null; return; }
      if (!inside(box, x, y)) state.box = null;
    }
    for (let i = 0; i < state.troops.length; i++) {
      if (inside(portrait(i), x, y)) { state.box = i; state.cam.x = state.troops[i].at[0]; state.cam.y = state.troops[i].at[1]; return; }
    }
  }
  function go() {
    const X = parseInt(state.dialog.x, 10), Y = parseInt(state.dialog.y, 10);
    if (!isNaN(X) && !isNaN(Y)) { state.cam.x = X; state.cam.y = Y; }
    state.dialog = null;
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { state.dialog = null; state.box = null; state.favs = false; return; }
    const D = state.dialog;
    if (!D) return;
    if (e.key === 'Enter') return go();
    if (!D.focus) return;
    if (e.ctrlKey && e.key.toLowerCase() === 'a') { D.all = true; return; }
    if (e.key === 'Backspace') { D[D.focus] = D.all ? '' : D[D.focus].slice(0, -1); D.all = false; return; }
    if (/^\d$/.test(e.key)) { if (D.all) { D[D.focus] = ''; D.all = false; } D[D.focus] += e.key; state.typed += e.key; }
  });
  cv.addEventListener('wheel', e => {
    state.zoom = Math.max(0, Math.min(2, state.zoom + (e.deltaY > 0 ? 1 : -1)));
    state.simple = state.zoom > 0; e.preventDefault();
  }, { passive: false });

  window.sim = {
    state,
    // speed: fraction of the route per second (negative = coming back toward `from`)
    march: (from, to, color = 'white', progress = 0.3, speed = 0.004, owner = null, kind = 'army') => {
      const P = v => (typeof v === 'string' ? state.sites[v] : v);
      state.marches.push({ from: P(from), to: P(to), color, progress, speed, owner, kind, t0: performance.now() / 1000 });
    },
    // an army standing still at a tile (gathering), with its owner's name
    farmer: (owner, at) => { state.farmers.push({ owner, at }); },
    // send a standing army somewhere (it turns into a march)
    sendFarmer: (i, to, speed = 0.02) => {
      const f = state.farmers.splice(i, 1)[0];
      state.marches.push({ from: f.at, to, color: 'white', progress: 0.05, speed, owner: f.owner, t0: performance.now() / 1000 });
    },
    clear: () => { state.marches.length = 0; state.farmers.length = 0; },
    ready: () => Object.values(A).every(i => i.complete && i.naturalWidth > 0),
  };
  // for the command-line test:  rok.html#march=enemy,camp,white
  const mh = new URLSearchParams(location.hash.slice(1)).get('march');
  if (mh) { const [f, t, c] = mh.split(','); sim.march(f, t, c || 'white', 0.2); }
  // rok.html#farmer=155,368  -> one of his armies parked there
  const fm = new URLSearchParams(location.hash.slice(1)).get('farmer');
  if (fm) { const [x, y] = fm.split(',').map(Number); sim.farmer('[P83L]JONH WICK', [x, y]); }
})();
</script>
</body>
</html>
