name: windows-exe
on:
  push:
    branches: [main]
  # Pushes only build and test. Publishing a release is done by hand:
  # Actions -> windows-exe -> Run workflow -> tick "publish".
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as the next numbered release"
        type: boolean
        default: false
      start_over:
        description: "Delete all earlier releases and publish this one as 1.0"
        type: boolean
        default: false
permissions:
  contents: write
# one build at a time, so two builds never take the same version number
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Pick the version number (1.0, 1.1, 1.2, ...)
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
                 | grep -E '^v[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n | tail -1 || true)
          if [ -z "$last" ] || [ "${{ inputs.start_over }}" = "true" ]; then v=1.0; else v="${last%%.*}.$(( ${last#*.} + 1 ))"; fi
          echo "$v" > rokwatch/version.txt
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"
      - name: Build RoKWatcher.exe
        run: python build_exe.py
      - name: Test the exe (self-test + control panel driving the test game in Edge)
        run: python tests/exe_smoke.py dist/RoKWatcher msedge
      - name: Test window mode (the game as its own program, driven with the real mouse)
        run: python tests/window_smoke.py dist/RoKWatcher
      - name: Test the update check from the built program (reaches GitHub, finds a release)
        shell: pwsh
        run: |
          $out = & dist/RoKWatcher/RoKWatcher.exe --check-update 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "Newest on GitHub: \d+\.\d+") { throw "the built program couldn't check for updates" }
      - name: Zip
        shell: pwsh
        run: |
          # the smoke test's Edge window may still hold files in the profile folder
          Stop-Process -Name msedge, RoKWatcher -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Remove-Item dist/RoKWatcher/config.yaml -ErrorAction SilentlyContinue
          Remove-Item dist/RoKWatcher/setup.yaml, dist/RoKWatcher/rokwatch.log -ErrorAction SilentlyContinue
          Remove-Item dist/RoKWatcher/debug, dist/RoKWatcher/browser-profile -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/RoKWatcher -DestinationPath RoKWatcher-windows.zip
      - name: Test the updater (installs this zip over an "old" copy, keeps user files, restarts it)
        run: python tests/updater_smoke.py RoKWatcher-windows.zip
      - name: Publish as a numbered release (the app's updater looks for these)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if [ "${{ inputs.start_over }}" = "true" ]; then
            # only now (all tests passed): remove every earlier release and its tag
            for t in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
              echo "deleting release $t"; gh release delete "$t" -y --cleanup-tag
            done
          fi
          gh release create "v$V" RoKWatcher-windows.zip --target "$GITHUB_SHA" --latest \
            --title "RoK Watcher $V" \
            --notes "$(git log -1 --pretty=%s). Download RoKWatcher-windows.zip, unzip it, double-click RoKWatcher.exe. If you already have it, the control panel updates itself."
      - name: Publish as the "latest" download
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest RoKWatcher-windows.zip --target "$GITHUB_SHA" --prerelease \
            --title "RoKWatcher for Windows (latest)" \
            --notes "Download RoKWatcher-windows.zip, unzip it, double-click RoKWatcher.exe. Built from $GITHUB_SHA."
